<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KAIZEN VOICE">
  <title>KAIZEN VOICE</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./kaizenvoice-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./kaizenvoice-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./kaizenvoice-512.png">

  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      background: #f5f7f8;
      color: #10231c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(15, 40, 30, .10);
      text-align: center;
    }
    .icon {
      display: block;
      width: 176px;
      height: 176px;
      margin: 0 auto 18px;
      border-radius: 34px;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
    .lead { margin: 12px 0 22px; color: #52625c; line-height: 1.7; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      padding: 14px 18px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #087c43, #0a9cd9);
      color: #fff;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    .hint { margin: 18px 0 0; color: #6f7d77; font-size: 13px; line-height: 1.65; }
    .launching { display: none; }
    body.standalone .install-only { display: none; }
    body.standalone .launching { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <img class="icon" src="./kaizenvoice-512.png" alt="KAIZEN VOICE">
    <h1>KAIZEN VOICE</h1>

    <div class="install-only">
      <p class="lead">現場問題提起ツールを開きます。</p>
      <a class="btn" id="openButton" href="#">KAIZEN VOICEを開く</a>
      <p class="hint">この画面を開いたまま「共有」→「ホーム画面に追加」を選択してください。</p>
    </div>

    <div class="launching">
      <p class="lead">KAIZEN VOICEを起動しています…</p>
      <a class="btn" id="fallbackButton" href="#">起動しない場合はこちら</a>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const GAS_URL = 'https://script.google.com/a/macros/ecodesign-labo.jp/s/AKfycbyXfeS3QTVf_ROlbHnooRfNXITfEz8bkOF6QqHBB4BU0yNNmYwNMBYIcueFKYBVDgU/exec';

      const isStandalone =
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      const openGas = () => {
        window.location.replace(GAS_URL);
      };

      document.getElementById('openButton').href = GAS_URL;
      document.getElementById('fallbackButton').href = GAS_URL;

      if (isStandalone) {
        document.body.classList.add('standalone');
        window.setTimeout(openGas, 250);
      }
    })();
  </script>
</body>
</html>
