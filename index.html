<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>KAIZEN VOICE</title>

  <!-- iPhoneホーム画面アイコン -->
  <link rel="apple-touch-icon"
        sizes="180x180"
        href="./kaizenvoice-180.png">

  <!-- 通常アイコン -->
  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="./kaizenvoice-192.png">

  <!-- PWA設定 -->
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KAIZEN VOICE">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9f8;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: #18342c;
    }

    .container {
      width: min(90%, 420px);
      text-align: center;
      padding: 32px 20px;
    }

    .logo {
      width: min(72vw, 280px);
      height: auto;
      border-radius: 22%;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }

    .message {
      margin: 0 0 28px;
      color: #53645f;
      line-height: 1.7;
      font-size: 14px;
    }

    .open-button {
      display: block;
      width: 100%;
      padding: 16px 20px;
      border-radius: 14px;
      background: #087b57;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
    }

    .install-guide {
      margin-top: 28px;
      font-size: 13px;
      line-height: 1.7;
      color: #70807b;
    }

    .launching {
      display: none;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="./kaizenvoice-512.png"
      alt="KAIZEN VOICE"
    >

    <h1>KAIZEN VOICE</h1>

    <p id="message" class="message">
      現場の問題を記録し、改善につなげるツールです。
    </p>

    <a
      id="openButton"
      class="open-button"
      href="https://script.google.com/a/macros/ecodesign-labo.jp/s/AKfycbyXfeS3QTVf_ROlbHnooRfNXITfEz8bkOF6QqHBB4BU0yNNmYwNMBYIcueFKYBVDgU/exec"
    >
      KAIZEN VOICEを開く
    </a>

    <div id="installGuide" class="install-guide">
      iPhoneではこのページをホーム画面に追加してください。<br>
      追加後はKAIZEN VOICEアイコンから起動できます。
    </div>

  </main>

  <script>
    const GAS_URL =
      'https://script.google.com/a/macros/ecodesign-labo.jp/s/' +
      'AKfycbyXfeS3QTVf_ROlbHnooRfNXITfEz8bkOF6QqHBB4BU0yNNmYwNMBYIcueFKYBVDgU/exec';

    function isStandaloneMode() {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );
    }

    if (isStandaloneMode()) {
      document.getElementById('message').textContent =
        'KAIZEN VOICEを開いています…';

      document.getElementById('openButton').style.display = 'none';
      document.getElementById('installGuide').style.display = 'none';

      setTimeout(function () {
        window.location.replace(GAS_URL);
      }, 500);
    }
  </script>
</body>
</html>
